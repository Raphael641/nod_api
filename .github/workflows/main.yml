name: Atualizar Inteligência NOD (ISP + Trânsito)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'processar_isp.py'
      - 'processar_transito.py' # Gatilho se você editar o script de trânsito

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      
      - name: Processar dados criminais (ISP)
        run: python processar_isp.py
      
      - name: Processar dados de trânsito (GM-RIO/Prefeitura)
        run: python processar_transito.py # O script que baixa o CSV e gera o JSON
      
      - name: Configurar Git e fazer push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "NOD Bot"
          git config --global user.email "nod-bot@users.noreply.github.com"
          git pull origin main --no-rebase --autostash || true
          
          # Adiciona os dois arquivos
          git add isp_crime_stats.json transito_stats.json
          
          if git diff --cached --quiet; then
            echo "📭 Sem alterações nos arquivos JSON"
          else
            git commit -m "🤖 Atualização de Inteligência (ISP + Trânsito) - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
